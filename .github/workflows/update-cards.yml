name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=0d1117&title_color=ffffff&text_color=8b949e&hide_border=true&custom_colors=Python:8b949e,Ruby:6e6a86,HTML:484f58,CSS:6e6a86,Shell:8b949e,Dockerfile:484f58
          path: profile/top-langs.svg
          token: ${{ secrets.MY_PAT_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "docs: update stats cards" || exit 0
          git push
